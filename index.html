<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Waikato Prayer Times">
    <link rel="manifest" href="/waikato-prayer-times/manifest.json">
    <link rel="apple-touch-icon" href="/waikato-prayer-times/icon-192.png">
    <title>Waikato Prayer Times</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #080e1a;
            color: #f0ead6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .moon { font-size: 3em; margin-bottom: 16px; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        p { color: rgba(240,234,214,0.6); font-size: 0.9em; margin-top: 8px; }
        .bar {
            width: 200px; height: 3px;
            background: rgba(201,168,76,0.2);
            border-radius: 3px;
            margin: 20px auto 0;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #c9a84c;
            border-radius: 3px;
            animation: load 1.5s ease-in-out forwards;
        }
        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="moon">🌙</div>
    <p>Loading Waikato Prayer Times...</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <script>
        // Preserve any query params / hash
        const dest = 'https://nextwave-nz.github.io/prayer-times/' 
                   + window.location.search 
                   + window.location.hash;
        setTimeout(() => { window.location.replace(dest); }, 1200);
    </script>
</body>
</html>
